<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rider Guard 운영 모니터</title>
<style>
  :root { --bg:#F4F1EA; --ink:#16181D; --muted:#5B5E66; --line:#DDD6C8; --accent:#C2410C; --soft:#FDE3D3; --info:#DBE4FB; --infoText:#1D3FA8 }
  * { box-sizing: border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 20px; background:var(--ink); color:#fff }
  header b { font-size:16px } header small { color:#A9ACB4; margin-right:auto }
  header input { height:34px; padding:0 10px; border-radius:8px; border:0; font:inherit; width:160px }
  main { display:grid; grid-template-columns:minmax(260px,340px) 1fr; gap:16px; padding:16px 20px }
  @media (max-width:760px) { main { grid-template-columns:1fr } }
  .panel { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden }
  .item { display:flex; flex-direction:column; gap:2px; padding:12px 14px; border-bottom:1px solid #EDE9E0; cursor:pointer }
  .item:last-child { border-bottom:0 } .item.sel { background:#FBF8F2 }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .pill { padding:2px 8px; border-radius:999px; font-size:12px; font-weight:700; background:#EDE9E0; color:#45474D }
  .pill.escalated { background:var(--soft); color:#9A3412 } .pill.help { background:var(--accent); color:#fff }
  .pill.failed { background:var(--accent); color:#fff } .pill.sent { background:var(--info); color:var(--infoText) }
  .muted { color:var(--muted) }
  #detail { padding:18px; display:flex; flex-direction:column; gap:14px }
  h2 { margin:0; font-size:20px } h3 { margin:0 0 6px; font-size:14px }
  dl { display:grid; grid-template-columns:110px 1fr; gap:4px 10px; margin:0 } dt { color:var(--muted) } dd { margin:0 }
  ol { margin:0; padding-left:18px } .empty { padding:24px; text-align:center; color:var(--muted) }
  #error { color:#FDBA8C; font-weight:700 }
</style>
</head>
<body>
<header>
  <b>Rider Guard 운영 모니터</b>
  <small>읽기 전용 — 사고 대응은 서버가 자동으로 처리해요</small>
  <input id="token" placeholder="모니터 토큰" type="password">
  <span id="error"></span>
</header>
<main>
  <section class="panel" id="list"><div class="empty">불러오는 중…</div></section>
  <section class="panel" id="detail"><div class="empty">왼쪽에서 사고를 선택하세요.</div></section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const STATUS = { escalated: '대응 중', resolved: '종료' };
  const RESOLUTION = { false_alarm: '오탐', rider_ok: '라이더가 괜찮다고 응답', handled: '대응 종료 (24시간 경과)' };
  const EMERGENCY = { waiting: '대기', sending: '신고 중', retrying: '재시도 중', sent: '신고함', failed: '실패 — 연락처에 직접 신고 요청', cancelled: '보내지 않음' };
  const DECISION = { alarm: '경보', alarm_unverified: '경보 (보조 조건·무동작 확인 불가)', reject: '기각', undetermined: '판정 불가' };
  const RULE = { impact: '충격 (헬멧 가속도)', support: '보조 (각속도·ΔV·헬멧 기울기)', post_still: '사후 무동작' };
  const fmt = (v) => (v == null ? '—' : Number(v).toFixed(2));

  /** 지표 판정으로 열린 사고의 근거 — 어떤 규칙이 어떤 실측값으로 발동했는지 (설계문서 5장) */
  function renderEvidence(ev) {
    if (!ev || !ev.traces) return null;
    return el('div', {},
      el('h3', { textContent: `판정 근거 — ${DECISION[ev.decision] || ev.decision}${ev.mode !== 'live' ? ' · ' + ev.mode : ''}${ev.producer ? ' · ' + ev.producer : ''}` }),
      el('ol', {}, ...ev.traces.map((t) => el('li', { textContent:
        `[${t.fired ? '발동' : t.blocked_by ? '판정 불가' : '미발동'}] ${RULE[t.rule] || t.rule}: ` +
        Object.entries(t.inputs).map(([k, v]) => `${k} ${fmt(v)}`).join(', ') + '  / 기준 ' +
        Object.entries(t.thresholds).map(([k, v]) => `${k} ${v}`).join(', ') +
        (t.blocked_by ? ` (${t.blocked_by})` : '') }))),
      el('div', { className: 'muted', textContent: '지표: ' + ev.indicators.map((i) => `${i.key} ${fmt(i.value)}${i.unit ? ' ' + i.unit : ''}${i.state !== 'ok' ? '(' + i.state + ')' : ''}`).join(' · ') }));
  }

  const EVENT = {
    detected: '충격 감지', rider_help: '라이더 도움 요청', rider_ok: '라이더 괜찮아요',
    rider_ok_after_escalation: '라이더 괜찮아요 (비상연락 시작 후)', escalated: '에스컬레이션',
    contact_notified: '비상연락 문자 발송', contact_acknowledged: '연락처가 확인함', contact_notify_failed: '문자 발송 실패',
    no_contacts: '등록된 비상연락처 없음', order_held: '주문 보류 · 대체배차 요청', order_reassigned: '대체배차 완료',
    emergency_reported: '119 자동 신고', emergency_report_failed: '119 자동 신고 실패', emergency_updated: '119 후속 문자',
    emergency_update_failed: '119 후속 문자 실패', rider_notified: '라이더 휴대폰 알림', resolved: '대응 종료', sensor_log_saved: '센서 로그 저장',
    center_reviewing: '상담원 배정 (예전 기록)',
  };
  const REASON = { no_response: '무응답', rider_requested: '라이더 도움 요청' };
  const RELATION = { family: '가족', coworker: '동료', other: '지인' };
  const ORDER = { assigned: '배달 중', held: '보류됨', reassigned: '대체배차 완료', delivered: '배달 완료' };
  let selected = null;

  // 서버가 OPS_TOKEN 없이 떴을 때(로컬 개발)만 개발용 토큰이 들어온다. 운영에서는 빈 값
  const DEFAULT_TOKEN = /*DEFAULT_TOKEN*/'';
  $('token').value = localStorage.getItem('ops.token') || DEFAULT_TOKEN;
  $('token').addEventListener('change', () => { localStorage.setItem('ops.token', $('token').value); refresh(); });

  async function api(path) {
    const res = await fetch('/ops/api' + path, { headers: { authorization: 'Bearer ' + $('token').value } });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error?.message || res.statusText);
    return json;
  }

  const time = (iso) => (iso ? new Date(iso).toLocaleTimeString('ko-KR', { hour12: false }) : '-');
  const el = (tag, props = {}, ...children) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children.filter((c) => c != null));
    return node;
  };

  async function refresh() {
    try {
      const { items } = await api('/incidents');
      $('error').textContent = '';
      $('list').replaceChildren(...(items.length ? items.map(renderItem) : [el('div', { className: 'empty', textContent: '최근 하루 동안 에스컬레이션된 사고가 없어요.' })]));
      if (selected) await showDetail(selected);
    } catch (e) { $('error').textContent = e.message; }
  }

  function renderItem(it) {
    return el('div', { className: 'item' + (it.id === selected ? ' sel' : ''), onclick: () => { selected = it.id; refresh(); } },
      el('div', { className: 'row' },
        el('span', { className: 'pill ' + it.status, textContent: STATUS[it.status] || it.status }),
        it.riderResponse === 'help' && it.status !== 'resolved' ? el('span', { className: 'pill help', textContent: '도움 요청' }) : null,
        el('b', { textContent: it.rider.name })),
      el('div', { className: 'muted', textContent: `감지 ${time(it.detectedAt)} · ${REASON[it.escalationReason] || ''}${it.resolution ? ' · ' + (RESOLUTION[it.resolution] || it.resolution) : ''}` }));
  }

  async function showDetail(id) {
    const d = await api('/incidents/' + id);
    $('detail').replaceChildren(
      el('div', { className: 'row' },
        el('h2', { textContent: d.rider.name }),
        el('span', { className: 'pill ' + d.status, textContent: STATUS[d.status] || d.status }),
        el('span', { className: 'pill ' + d.emergency, textContent: '119 ' + (EMERGENCY[d.emergency] || d.emergency) })),
      el('dl', {},
        el('dt', { textContent: '감지' }), el('dd', { textContent: `${time(d.detectedAt)} · ${REASON[d.escalationReason] || ''}` }),
        el('dt', { textContent: '종료' }), el('dd', { textContent: d.resolution ? RESOLUTION[d.resolution] || d.resolution : '진행 중' }),
        el('dt', { textContent: '주문' }), el('dd', { textContent: d.order ? `${d.order.storeName} → ${d.order.destination} (${ORDER[d.order.status] || d.order.status})` : '-' })),
      el('div', {}, el('h3', { textContent: '비상연락망' }), el('ol', {}, ...d.contacts.map((c) =>
        el('li', { textContent: `${c.name} (${RELATION[c.relation] || c.relation}) — ${c.notifiedAt ? '문자 ' + time(c.notifiedAt) : '미발송'}${c.acknowledgedAt ? ' · 확인 ' + time(c.acknowledgedAt) : ''}` })))),
      renderEvidence(d.evidence),
      el('div', {}, el('h3', { textContent: '타임라인' }), el('ol', {}, ...d.timeline.map((e) =>
        el('li', { textContent: `${time(e.at)} ${EVENT[e.type] || e.type}${e.data && e.data.priority ? ` (${e.data.priority}순위 ${e.data.name || ''})` : ''}${e.data && e.data.outcome ? ` — ${RESOLUTION[e.data.outcome] || e.data.outcome}` : ''}` })))),
    );
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
