[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touchfree-vitals"
version = "0.1.0"
description = "비접촉 생체신호 모니터링 + 환경 개입 시스템"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "numpy>=1.23",
    "scipy>=1.9",
    # 5.x 는 CascadeClassifier 와 번들 haarcascade 를 들어냈다. 얼굴 검출이 통째로
    # 사라지면 ROI 가 화면 중앙 고정 박스로 떨어져 정확도를 잃는다. 데모가 검증된 4.x 유지.
    # 헤드리스 서버에 올릴 때는 opencv-python-headless 로 바꾼다.
    "opencv-python>=4.7,<5",
]

[project.optional-dependencies]
# 라즈베리파이에서만 설치한다. I2C/GPIO 라이브러리라 Windows/macOS 에서는
# 설치도 import 도 실패한다. 어댑터가 이 라이브러리를 start() 안에서 늦게
# import 하므로, 없으면 해당 카드만 no_adapter 로 뜨고 나머지는 그대로 돈다.
#   Pi:  uv pip install -e ".[dev,pi]"
pi = [
    "smbus2>=0.4",       # BME680 / BH1750 (I2C)
    "bme680>=1.1",       # Pimoroni BME680 드라이버
    "gpiozero>=2.0",     # PIR (GPIO)
    "lgpio>=0.2",        # Pi 5 의 gpiozero 백엔드
    "tinytuya>=1.13",    # Tuya 플러그/전구 (LAN 제어)
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools]
packages = ["core", "core.adapters", "api", "api.routes"]

[tool.ruff]
line-length = 100
target-version = "py311"
# legacy/ 는 Phase 2·5에서 이식해 올 기존 프로토타입이다. 지금은 손대지 않는다.
extend-exclude = ["legacy"]

[tool.ruff.lint]
# W 를 켠 이유: 잘못된 이스케이프 시퀀스(W605)를 놓쳐 SyntaxWarning 이 났다.
# 그 경고는 사용자 코드보다 먼저 stderr 로 나가서 출력 인코딩 설정을 우회한다.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
# 코드 자체는 3.11 을 지킨다. 이 값만 3.12 인 이유는 numpy 2.5 의 스텁이
# 3.12 문법(type 문)을 써서 3.11 로 두면 스텁 파싱에서 먼저 죽기 때문이다.
python_version = "3.12"
strict = true
exclude = ["legacy"]

[[tool.mypy.overrides]]
# scipy/cv2 는 스텁이 불완전하고, 나머지는 파이에서만 설치되는 하드웨어 드라이버라
# 개발 PC 에는 아예 없다.
module = [
    "scipy.*", "cv2.*", "bme680.*", "smbus2.*", "gpiozero.*", "tinytuya.*",
    # picamera2/libcamera 는 pip 이 아니라 apt 로 온다. pi extras 에 넣을 수 없어
    # venv 를 --system-site-packages 로 만들어야 보인다 (docs/hardware.md §0).
    "picamera2.*", "libcamera.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
