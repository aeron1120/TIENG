# 노트북/PC 웹캠 하나로 돌리는 설정.
#   DEVICE_CONFIG=config/device.webcam.yaml uvicorn api.main:app --port 8000
#
# 심박(rPPG)만 실제 카메라로 재고 나머지는 합성이다. 파이 전용 하드웨어
# (BME680/BH1750/PIR/MLX90640, Tuya)가 없는 개발 PC 에서 실측 rPPG 경로를
# 눈으로 확인하려는 용도다. 화면에서 심박 카드만 금색 "실측"으로 떠야 한다.
device_id: tfv-webcam-01
sample_rate_hz: 1
thresholds: config/thresholds.yaml
metrics_csv: null              # 개발용이라 기본은 끈다
interventions_csv: logs/interventions.webcam.csv

adapters:
  # 카메라를 소유하는 어댑터. 지표는 내지 않고 프레임만 나눠 준다. 장치를 두 번
  # 열 수 없으므로 소유를 한 곳에 몰아 두고, rppg 와 drowsiness 는 둘 다 소비자다.
  # 이렇게 하면 심박을 빼도 졸음이 계속 돌고 그 반대도 된다.
  - id: camera
    module: core.adapters.camera
    mode: live
    # USB/내장 웹캠이므로 backend 는 opencv 다 (device.yaml 의 picamera2 는 CSI 전용).
    # 720p 로 올린 이유는 심박이 아니라 졸음이다. rPPG 는 볼 ROI 의 평균 RGB 만
    # 쓰므로 480p 로 충분하지만, 눈꺼풀을 재려면 눈이 몇 픽셀로 잡히느냐가 그대로
    # 정밀도가 된다. 480p 에서는 눈 하나가 40x20 px 남짓이라 감김 정도를 못 가른다.
    # fps 는 요청값이다. 이 노트북 내장 카메라(Intel MIPI)는 해상도·포맷을 어떻게
    # 바꿔도 28~30 밖에 못 냈다 — DSHOW 는 60 이라고 보고하면서 실제로는 29.7 만
    # 줬다. 실측값은 /api/camera 의 fps 로 나가니 그걸 믿을 것.
    #
    # 60 이 왜 필요한가: 재개안이 기준선 164ms 이라 30fps 에서는 5프레임이다.
    # 지속시간은 그럭저럭 재지만 속도(AVR)는 못 잰다. 문헌이 1분 선행을 말하는
    # 지표가 그 AVR 이다.
    params: { camera_index: 0, width: 1280, height: 720, fps: 60, backend: opencv }
  - id: rppg
    module: core.adapters.rppg
    mode: live
    # 졸음 모드에서는 쉰다. 카메라 프레임과 CPU 를 졸음 쪽에 몰아주기 위해서다 —
    # 눈깜빡임은 100~400ms 라 프레임률이 곧 정확도다 (core/mode.py).
    modes: [vitals]
    params: { source: camera, window_s: 12 }
  - id: drowsiness
    module: core.adapters.drowsiness
    mode: live
    # 카메라를 직접 열지 않는다. camera 어댑터가 나눠 주는 프레임을 받아 쓴다.
    #
    # baseline_s 는 처음 이만큼을 "각성 상태"로 보고 그 사람의 평소 깜빡임을
    # 학습하는 시간이다. 절대 임계를 쓰지 않는 이유는 개인차가 커서다 — 같은
    # 사람에게서도 깜빡임이 194~465ms 로 흔들렸다.
    #
    # 운전 시작 직후가 각성 상태라는 가정이 깔려 있다. 이미 졸린 채로 출발하면
    # 기준선이 졸린 상태로 잡혀 경보가 늦어진다. 실차에서는 시동 직후 몇 분을
    # 쓰거나, 여러 주행의 기준선을 사람별로 남겨 두는 쪽이 맞다.
    # 카메라마다 다른 숫자는 여기가 아니라 튜닝 프로파일에 있다 (core/tuning.py).
    # 지표를 뽑는 구조는 같고 값만 갈린다.
    params: { source: camera, tuning: tuning/web_cam.yaml }
  - id: env
    module: core.adapters.env_mock
    mode: simulated
    # dark_every_s: 0 으로 어둡게 만드는 주기를 끈다. 여기서는 실제 카메라
    # 신뢰도를 보는 게 목적이라, 합성 조도가 L1 을 대신 터뜨리면 방해가 된다.
    params: { base_lux: 140, dark_every_s: 0 }
  - id: rr_estimator
    module: core.adapters.thermal_mlx90640
    mode: simulated
    params: { nostril_roi: [13, 9, 6, 5], refresh_hz: 4, synthetic_rpm: 15 }
  - id: posture
    module: core.adapters.posture_mock
    mode: simulated
    params: { hold_ticks: 4 }

actuators:
  - id: room_light
    module: actuators.tuya_plug
    mode: simulated            # 네트워크를 건드리지 않는다
    params: { simulated_lux_gain: 120 }
  - id: guardian_email
    module: actuators.notify_email
    mode: simulated            # 실제로 보내지 않고 로그만 남는다

policies:
  - module: core.policy.l1_light
    enabled: true
    params: { switch_id: room_light }
  - module: core.policy.l4_guardian
    enabled: true
    params: { notifier_id: guardian_email }
  # 졸음 사다리. 칸마다 인스턴스가 하나씩이고, 지속 시간이 순서를 만든다
  # (core/policy/drowsy_ladder.py). 칸 하나를 꺼도 나머지는 그대로 돈다.
  - module: core.policy.drowsy_ladder
    enabled: true
    params: { rung: notice }
  - module: core.policy.drowsy_ladder
    enabled: true
    params: { rung: alert, switch_id: room_light }
  - module: core.policy.drowsy_ladder
    enabled: true
    params: { rung: guardian, notifier_id: guardian_email }
