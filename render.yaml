# Render 블루프린트. 저장소를 연결하면 이 파일대로 서비스를 만든다.
#
# 여기 올라가는 것은 하드웨어 없는 데모다 (config/device.mock.yaml). 실제 방의
# 지표는 파이에 있고 이쪽으로 오지 않는다 — 값은 전부 합성이라 화면 뱃지가
# "시뮬레이션"으로 뜬다.
#
# free 플랜은 접속이 없으면 서비스를 재운다. 잠든 뒤 첫 요청은 컨테이너가 다시
# 뜨는 동안 30초쯤 걸리고, 그때 계정 DB(state/users.db)도 같이 사라진다.
# 계정을 남기려면 Supabase 로 옮겨야 한다.
services:
  - type: web
    name: tieng-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # 세션 없이도 200 을 주는 경로라야 한다. 인증을 요구하면 Render 가 계속
    # 죽은 것으로 보고 재시작한다.
    healthCheckPath: /api/auth/me
    envVars:
      - key: DEVICE_CONFIG
        value: config/device.mock.yaml
