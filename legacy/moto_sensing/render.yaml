# Render 블루프린트 — API 만 돌린다. 화면은 Cloudflare Pages 가 맡는다.
#
# 여기 올라가는 것은 센서가 하나도 없는 배포다 (config/cloud.yaml, --source sim).
# 값은 전부 합성이고 스냅샷의 mode 가 "simulated" 로 나가므로, 화면이 배지로 밝힌다
# (CLAUDE.md §0-4). 배지가 "live" 로 뜨면 구성이 잘못된 것이다.
#
# 기록은 끈다. 컨테이너 디스크는 재배포마다 사라지고 free 플랜은 잠들기까지 해서,
# 켜 두면 1kHz parquet 로 디스크를 채우기만 하고 남는 것이 없다.
#
# free 플랜은 접속이 없으면 잠들고 첫 요청이 30초쯤 걸린다. 화면(Pages)은 잠들지
# 않으므로 화면이 먼저 뜨고 값이 늦게 붙는다 — 그동안은 픽스처가 보인다.
services:
  - type: web
    name: moto-sensing-api
    runtime: python
    plan: free
    # 기본값(오리건)은 한국에서 왕복 200ms 다. 리전은 만든 뒤에 못 바꾼다 —
    # 바꾸려면 서비스를 다시 만들어야 한다.
    region: singapore
    buildCommand: pip install -e .
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    # /api/snapshot 을 걸면 안 된다. 첫 틱 전에는 503 이라 Render 가 기동 중인
    # 서비스를 죽은 것으로 보고 무한 재시작한다.
    healthCheckPath: /api/health
    envVars:
      - key: MOTO_CONFIG
        value: config/cloud.yaml
      - key: MOTO_SOURCE
        value: sim
      # 파이와 같은 계열로 맞춘다.
      - key: PYTHON_VERSION
        value: "3.13"
