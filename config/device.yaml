# 실기(라즈베리파이) 설정. 하드웨어를 꽂고 이 파일로 띄운다.
#   DEVICE_CONFIG=config/device.yaml uvicorn api.main:app --host 0.0.0.0 --port 8000
#
# 하드웨어가 아직 없으면 해당 어댑터만 no_adapter 카드로 뜨고 나머지는 정상 동작한다.
# 연동 순서와 확인 방법은 docs/hardware.md 참고.
device_id: tfv-pi-01
sample_rate_hz: 1
thresholds: config/thresholds.yaml
metrics_csv: logs/metrics.csv
interventions_csv: logs/interventions.csv

adapters:
  # 카메라를 소유하는 어댑터. 지표는 내지 않고 프레임만 나눠 준다. 장치를 두 번
  # 열 수 없으므로 소유를 한 곳에 몰아 두고, rppg 와 drowsiness 는 둘 다 소비자다.
  # 이렇게 하면 심박을 빼도 졸음이 계속 돌고 그 반대도 된다.
  - id: camera
    module: core.adapters.camera
    mode: live
    # backend 는 CSI 리본 카메라라 picamera2. USB 웹캠으로 바꾸면 opencv 로 되돌린다.
    # 720p 로 올린 이유는 심박이 아니라 졸음이다 — 눈이 몇 픽셀로 잡히느냐가 그대로
    # 눈꺼풀 측정 정밀도가 된다. rPPG 는 볼 ROI 평균 RGB 만 쓰므로 480p 로도 됐다.
    # Camera Module 3 는 고프레임률을 낼 수 있다. 재개안 속도(AVR)를 제대로 재려면
    # 30fps 로는 부족하다 — 재개안 구간이 5프레임밖에 안 된다.
    params: { camera_index: 0, width: 1280, height: 720, fps: 60, backend: picamera2 }
  - id: rppg
    module: core.adapters.rppg
    mode: live
    # 졸음 모드에서는 쉰다. 카메라 프레임과 CPU 를 졸음 쪽에 몰아주기 위해서다 —
    # 눈깜빡임은 100~400ms 라 프레임률이 곧 정확도다 (core/mode.py).
    modes: [vitals]
    # window_s 는 데모 v4 에서 검증된 12초를 쓴다. 10초 아래로 내리면 BPM 이 튄다.
    params: { source: camera, window_s: 12 }
  # 눈꺼풀로 졸음을 재는 어댑터. 같은 카메라를 나눠 쓴다.
  - id: drowsiness
    module: core.adapters.drowsiness
    mode: live
    # 카메라마다 다른 숫자는 여기가 아니라 튜닝 프로파일에 있다 (core/tuning.py).
    # 지표를 뽑는 구조는 같고 값만 갈린다.
    params: { source: camera, tuning: tuning/rasp_cam.yaml }
  - id: bme680
    module: core.adapters.env_bme680
    mode: live
    params: { i2c_addr: 0x76, temp_offset: 0.0 }
  - id: bh1750
    module: core.adapters.env_bh1750
    mode: live
    params: { i2c_addr: 0x23, bus: 1 }
  - id: pir
    module: core.adapters.pir
    mode: live
    params: { pin: 4, hold_s: 30 }
  - id: rr_estimator
    module: core.adapters.thermal_mlx90640
    mode: live
    # nostril_roi 는 32x24 프레임 좌표계의 (x, y, w, h) 다. 코가 몇 픽셀에 잡히는지는
    # 카메라-얼굴 거리에 달렸으므로 화면을 보고 맞춘 뒤 실측해서 다시 적을 것.
    # refresh_hz 는 2~8 을 쓴다 — 더 올리면 프레임당 잡음이 커지고, 호흡 대역
    # (0.1~0.5Hz)에는 4Hz 로도 나이퀴스트 여유가 충분하다.
    params: { nostril_roi: [13, 9, 6, 5], refresh_hz: 4 }
  - id: posture
    module: core.adapters.posture_mock
    mode: unavailable

actuators:
  - id: room_light
    module: actuators.tuya_plug
    mode: live
    # tinytuya wizard 로 뽑은 값을 넣는다. 채우기 전에는 로드가 실패하고
    # L1 은 "액추에이터가 연결돼 있지 않다"로 보류된다.
    params: { device_id: "", local_key: "", ip: "", version: 3.3 }
  - id: guardian_email
    module: actuators.notify_email
    mode: live
    # 자격증명은 config 가 아니라 환경변수로 온다 (저장소에 들어가면 안 된다).
    #   TFV_SMTP_USER / TFV_SMTP_PASSWORD / TFV_GUARDIAN_EMAIL
    # 안 채우면 로드가 실패하고 L4 는 "알림 액추에이터가 없다"로 보류된다.
    params: { host: smtp.gmail.com, port: 587 }

policies:
  - module: core.policy.l1_light
    enabled: true
    params: { switch_id: room_light }
  - module: core.policy.l4_guardian
    enabled: true
    params: { notifier_id: guardian_email }
