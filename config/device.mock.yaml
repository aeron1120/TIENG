# 하드웨어 0개로 개발/백업 데모용. DEVICE_CONFIG=config/device.mock.yaml
#
# Phase 1 시점에는 mock 어댑터가 rr_mock, posture_mock 둘뿐이다.
# rppg / bme680 항목은 모듈이 아직 없으므로 registry가 no_adapter로 강등하고,
# provides 에 적힌 key로 "값 없음(—)" 카드 자리만 예약한다.
# Phase 2·3에서 실제 어댑터가 생기면 module 만 갈아끼우면 된다.
device_id: tfv-mock-01
sample_rate_hz: 1
# 개발용이라 기본은 끈다. 백업 데모로 쓸 때는 logs/metrics.csv 로 채운다.
metrics_csv: null

adapters:
  - id: rppg
    module: core.adapters.rppg
    mode: unavailable
    provides: [hr]
  - id: bme680
    module: core.adapters.env_bme680
    mode: unavailable
    provides: [temp, humidity]
  - id: rr_estimator
    module: core.adapters.rr_mock
    mode: simulated
    params: { base_rpm: 15, noise: 1.2 }
  - id: posture
    module: core.adapters.posture_mock
    mode: simulated
    params: { hold_ticks: 4 }
