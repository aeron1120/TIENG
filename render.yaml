# Render 블루프린트 — API 만 돌린다. 화면은 Cloudflare Pages 가 맡는다 (docs/deploy.md).
#
# 여기 올라가는 것은 하드웨어 없는 데모다 (config/device.mock.yaml). 실제 방의
# 지표는 파이에 있고 이쪽으로 오지 않는다 — 값은 전부 합성이라 화면 뱃지가
# "시뮬레이션"으로 뜬다.
#
# web/dist 가 없으므로 api/main.py 는 SPA catch-all 을 걸지 않는다. 없는 /api 경로가
# index.html 대신 제대로 404 를 주므로 API 전용으로는 오히려 이쪽이 맞다.
#
# free 플랜은 접속이 없으면 서비스를 재운다. 잠든 뒤 첫 요청은 30초쯤 걸리고, 그때
# 계정 DB(state/users.db)도 같이 사라진다 — 계정을 남기려면 Supabase 로 옮겨야 한다.
services:
  - type: web
    name: tieng-api
    runtime: python
    plan: free
    # 기본값(오리건)은 한국에서 왕복 200ms 다. 로그인 한 번에 쿼리가 여러 번 오가므로
    # 화면이 눈에 띄게 느려진다. 리전은 만든 뒤에 못 바꾼다 — 서비스를 다시 만들어야 한다.
    region: singapore
    # -e 로 까는 이유: pyproject 의 packages 에 actuators 가 없어서 일반 설치로는
    # tuya_plug / notify_email 을 못 찾는다.
    buildCommand: pip install -e .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    # 세션 없이도 200 을 주는 경로라야 한다. 인증을 요구하는 경로를 걸면 Render 가
    # 계속 죽은 것으로 보고 재시작한다.
    healthCheckPath: /api/auth/me
    envVars:
      - key: DEVICE_CONFIG
        value: config/device.mock.yaml
      # 파이(Trixie)와 같은 계열로 맞춘다.
      - key: PYTHON_VERSION
        value: "3.13"
