<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사고 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16181D}
a{color:#FDBA8C}a:hover{color:#FED7AA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 36px; display: flex; flex-direction: column; align-items: stretch; gap: 28px; background: #16181D; color: #FFFFFF; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<div style="padding: 6px 12px; border-radius: 999px; background: #C2410C; font-size: 13px; font-weight: 700">강한 충격이 감지됐어요</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.6px">괜찮으신가요?</h1>
</div>
<div style="display: flex; justify-content: center">
<div style="position: relative; width: 240px; height: 240px">
<svg width="240" height="240" viewBox="0 0 240 240" aria-hidden="true" style="position: absolute; left: 0; top: 0; transform: rotate(-90deg)">
<circle cx="120" cy="120" r="104" fill="none" stroke="#2C2F37" stroke-width="12"></circle>
<circle cx="120" cy="120" r="104" fill="none" stroke="#F97316" stroke-width="12" stroke-linecap="round" stroke-dasharray="653.45" stroke-dashoffset="{{ringOffset}}" style="transition: stroke-dashoffset 1s linear"></circle>
</svg>
<div style="position: absolute; left: 0; top: 0; width: 240px; height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<div role="timer" aria-live="polite" style="font-family: 'IBM Plex Mono', monospace; font-size: 76px; font-weight: 600; line-height: 1">{{left}}</div>
<div style="font-size: 14px; color: #B7BAC2">초 남음</div>
</div>
</div>
</div>
<sc-if value="{{counting}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; text-align: center; font-size: 15px; line-height: 1.55; color: #D4D6DB">응답이 없으면 비상연락처와 관제센터에<br>현재 위치를 자동으로 알려요.</p>
</sc-if>
<sc-if value="{{expired}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<p style="margin: 0; font-size: 16px; font-weight: 700; color: #FDBA8C">응답이 없어 비상연락을 시작했어요</p>
<button type="button" onClick="{{restart}}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #B7BAC2; font-size: 13px; text-decoration: underline; font-family: inherit">데모 다시 보기</button>
</div>
</sc-if>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<a href="Status.dc.html" style="display: flex; align-items: center; justify-content: center; height: 72px; border-radius: 18px; background: #C2410C; color: #FFFFFF; font-size: 20px; font-weight: 700; text-decoration: none">도움이 필요해요</a>
<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 72px; border-radius: 18px; background: #FFFFFF; color: #16181D; font-size: 20px; font-weight: 700; text-decoration: none">괜찮아요</a>
<p style="margin: 0; text-align: center; font-size: 12px; color: #9A9DA6">'괜찮아요'를 누르면 오탐으로 기록되고 운행을 계속해요.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seconds":{"editor":"int","default":30,"min":5,"max":120},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  total() { return this.props.seconds ?? 30; }
  current() { return (this.state && this.state.left != null) ? this.state.left : this.total(); }
  start() {
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      const l = this.current();
      if (l <= 0) { clearInterval(this.timer); return; }
      this.setState({ left: l - 1 });
    }, 1000);
  }
  componentDidMount() { this.start(); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const total = this.total();
    const left = Math.max(0, this.current());
    const C = 653.45;
    return {
      left: left,
      ringOffset: String(C * (1 - left / total)),
      counting: left > 0,
      expired: left <= 0,
      restart: () => { this.setState({ left: total }); this.start(); }
    };
  }
}
</script>
</body>
</html>
