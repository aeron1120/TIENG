# 폰을 안경에 달 카메라 위치에 둔 것. **아직 이 파이프라인으로는 안 돈다.**
#
# 사양만 바꾸면 되는 것이 아니라 검출 경로가 통째로 바뀐다. 지금 눈 상자는 YuNet 이
# 찾은 **얼굴**의 랜드마크 5점에서 나오는데, 안경 위치(눈앞 2~3cm)에는 얼굴이 없다.
# 눈이 곧 화면 전체라 얼굴 검출기가 아무것도 못 찾는다.
#
# 그래서 이 프로파일은 값이 아니라 **무엇을 바꿔야 하는지**를 적어 둔 자리다.
#
#   1. 눈 상자: 얼굴 랜드마크 대신 화면 전체(또는 고정 ROI)를 쓴다.
#   2. 머리 자세: 코·입이 안 보이므로 이 채널이 사라진다 -> head 가중치 0.
#      그러면 남은 채널이 전부 개안도에서 나와 "사실상 한 채널" 문제가 돌아온다.
#      IMU 를 붙이면 자세를 되살릴 수 있다 (폰에는 이미 있다).
#   3. 개안도: 눈이 화면을 채우므로 어두운 덩어리 비율의 범위가 완전히 달라진다.
#   4. 초점: 폰 후면 카메라는 2~3cm 에 초점이 안 맞는다. 접사 렌즈나 거리 확보 필요.
#
# 여기까지 되면 experiments/pupil_spike/pupil.py 가 그대로 붙는다 — 그 파일이 애초에
# "눈 크롭 + 홍채 원"만 받도록 좁혀 둔 이유가 이것이다.
name: phone_smartglass
measured: false
notes: |
  아직 안 됨. 얼굴이 시야에 없어 YuNet 랜드마크 경로가 성립하지 않는다.
  검출 전단을 바꾸기 전에는 이 프로파일로 띄워도 값이 안 나온다.
window_s: 60
baseline_s: 90
geometry:
  eye_box_w: 0.45
  eye_box_h: 0.32
  min_iod_px: 40
  yunet_score: 0.6
  yunet_nms: 0.3
openness:
  open_pctl: 90
  closed_pctl: 2
  min_samples: 60
  min_span: 0.10
blink:
  enter: 0.55
  exit: 0.35
  min_s: 0.03
  max_s: 1.20
score:
  z_full: 3.0
  z_sd_floor_rel: 0.10
  warn: 30
  alert: 60
  # 얼굴이 없으므로 고개 채널은 0 이다. 그 몫을 남에게 나눠 주지 않는다 — 남은
  # 채널이 전부 개안도에서 나오는데 합이 1 이면 그 사실이 가려진다.
  weights: { reopen: 0.40, duration: 0.30, blink_rate: 0.15, head: 0.0, perclos: 0.10 }
track:
  min_rate: 0.45
  keep_rate: 0.30
