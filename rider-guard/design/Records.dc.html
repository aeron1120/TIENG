<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사고 기록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F1EA}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F1EA; color: #16181D; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">
<div style="flex-grow: 1; padding: 52px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px">사고 기록</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5B5E66">보험·산재 접수에 쓸 수 있도록 모든 감지 기록을 보관해요.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; background: #FFFFFF; border: 1px solid #DDD6C8; border-radius: 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600">2026.09.24 21:42</div>
<div style="padding: 4px 9px; border-radius: 999px; background: #16181D; color: #FFFFFF; font-size: 12px; font-weight: 700">대응 완료</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 12px; color: #5B5E66">감지 위치</div><div style="font-size: 14px; font-weight: 600">[주소]</div></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 12px; color: #5B5E66">라이더 응답</div><div style="font-size: 14px; font-weight: 600">도움 요청 · 14초</div></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 12px; color: #5B5E66">비상연락</div><div style="font-size: 14px; font-weight: 600">1순위 문자 발송</div></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 12px; color: #5B5E66">주문 처리</div><div style="font-size: 14px; font-weight: 600">대체배차 완료</div></div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" style="flex-grow: 1; height: 48px; border: 0; border-radius: 12px; background: #16181D; color: #FFFFFF; font-size: 14px; font-weight: 700; font-family: inherit">사고기록 PDF 받기</button>
<button type="button" style="height: 48px; padding: 0 16px; border: 1.5px solid #16181D; border-radius: 12px; background: #FFFFFF; color: #16181D; font-size: 14px; font-weight: 600; font-family: inherit">공유</button>
</div>
</div>
<div style="font-size: 13px; font-weight: 700; color: #5B5E66; padding: 4px 4px 0">이전 기록</div>
<div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #DDD6C8; border-radius: 16px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<a href="#record" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 16px; color: #16181D; text-decoration: none; border-bottom: {{it.border}}">
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600">{{it.when}}</div>
<div style="font-size: 13px; color: #5B5E66">{{it.what}}</div>
</div>
<div style="padding: 3px 8px; border-radius: 999px; background: #EDE9E0; color: #45474D; font-size: 12px; font-weight: 700">{{it.tag}}</div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B5E66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</div>
</div>
<nav aria-label="하단 메뉴" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 22px; background: #FFFFFF; border-top: 1px solid #DDD6C8">
<a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; color: #5B5E66; font-size: 12px; font-weight: 600; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>홈</a>
<a href="Records.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; color: #C2410C; font-size: 12px; font-weight: 700; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6"></path><path d="M9 12h6"></path><path d="M9 16h3"></path></svg>기록</a>
<a href="Setup.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; color: #5B5E66; font-size: 12px; font-weight: 600; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3 20a6 6 0 0 1 12 0"></path><path d="M16 5a3 3 0 0 1 0 6"></path><path d="M18 14a5 5 0 0 1 3 6"></path></svg>연락망</a>
<a href="#settings" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; color: #5B5E66; font-size: 12px; font-weight: 600; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>설정</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { when: '09.18 18:05', what: '충격 감지 → 괜찮아요 응답', tag: '오탐' },
      { when: '09.11 20:31', what: '급정거 감지 → 괜찮아요 응답', tag: '오탐' },
      { when: '09.03 17:12', what: '충격 감지 → 무응답, 비상연락', tag: '대응 완료' }
    ];
    return {
      items: raw.map((r, i) => ({ ...r, border: i < raw.length - 1 ? '1px solid #EDE9E0' : '0' }))
    };
  }
}
</script>
</body>
</html>
