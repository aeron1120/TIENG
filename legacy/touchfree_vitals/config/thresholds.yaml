# 정책 조건은 코드가 아니라 여기서 온다 (README §0-5, §10).
# 발표할 때는 어느 프로파일로 돌렸는지 반드시 밝힐 것.
profile: demo          # demo | production

demo:
  hr: { low: 55, high: 95, sustain_s: 20 }
  confidence_min: 0.4
  night_mode: { start: "22:00", end: "07:00" }   # 로컬 시간 기준
  policies:
    l1_light:
      lux_min: 80          # 이보다 어두울 때만 조명이 원인이라고 본다
      cooldown_s: 300      # 껐다 켰다 반복하지 않도록
      evaluate_after_s: 20 # 켠 뒤 이만큼 지나 confidence 를 다시 잰다
    l4_guardian:
      # 개발 중에는 두 경로를 다 본다. 실사용 프로파일은 지표 이상만 켠다.
      triggers: [abnormal_hr, measurement_lost]
      # L1 이 불을 켜 두면 방이 다시 어두워지지 않아 mock 에서는 이 조건이
      # 사실상 안 걸린다. demo 는 hr 이탈(excursion)로 L4 를 보여 준다.
      lost_sustain_s: 25   # 사람은 있는데 심박수를 이만큼 못 잡으면
      cancel_window_s: 30  # 보내기 전 취소할 수 있는 시간
      cooldown_s: 180      # 시연 중 여러 번 볼 수 있게 짧게
    drowsy_ladder:
      # 졸음 판정이 얼마나 이어져야 그 단계로 올라가는가. 판정 자체(점수 임계)는
      # 사람마다 달라 여기가 아니라 튜닝 프로파일에 있다 (tuning/*.yaml).
      # 시연에서 세 칸이 다 올라가는 걸 보려면 짧아야 한다.
      notice: { sustain_s: 5, cooldown_s: 60 }
      alert: { sustain_s: 15, cooldown_s: 120 }
      guardian: { sustain_s: 40, cooldown_s: 300, cancel_window_s: 30 }

production:
  hr: { low: 45, high: 120, sustain_s: 120 }
  confidence_min: 0.6
  night_mode: { start: "21:00", end: "08:00" }
  policies:
    l1_light:
      lux_min: 60
      cooldown_s: 900
      evaluate_after_s: 30
    l4_guardian:
      # measurement_lost 는 뺀다. 센서를 가리거나 자세만 바꿔도 떠서 실사용에서는
      # 보호자를 너무 자주 부른다. 지표가 실제로 대역을 벗어난 경우만 알린다.
      triggers: [abnormal_hr]
      lost_sustain_s: 180
      cancel_window_s: 30
      cooldown_s: 1800
    drowsy_ladder:
      # 실사용은 한 번 튄 판정으로 올라가지 않는다. 특히 보호자는 2분을 본다 —
      # 잘못 부른 알림이 한 번 쌓이면 그 다음부터는 아무도 보지 않는다.
      notice: { sustain_s: 10, cooldown_s: 300 }
      alert: { sustain_s: 30, cooldown_s: 600 }
      guardian: { sustain_s: 120, cooldown_s: 1800, cancel_window_s: 30 }
