[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touchfree-vitals"
version = "0.1.0"
description = "비접촉 생체신호 모니터링 + 환경 개입 시스템"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "numpy>=1.23",
    "scipy>=1.9",
    # 5.x 는 CascadeClassifier 와 번들 haarcascade 를 들어냈다. 얼굴 검출이 통째로
    # 사라지면 ROI 가 화면 중앙 고정 박스로 떨어져 정확도를 잃는다. 데모가 검증된 4.x 유지.
    # 헤드리스 서버에 올릴 때는 opencv-python-headless 로 바꾼다.
    "opencv-python>=4.7,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools]
packages = ["core", "core.adapters", "api", "api.routes"]

[tool.ruff]
line-length = 100
target-version = "py311"
# legacy/ 는 Phase 2·5에서 이식해 올 기존 프로토타입이다. 지금은 손대지 않는다.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# 코드 자체는 3.11 을 지킨다. 이 값만 3.12 인 이유는 numpy 2.5 의 스텁이
# 3.12 문법(type 문)을 써서 3.11 로 두면 스텁 파싱에서 먼저 죽기 때문이다.
python_version = "3.12"
strict = true
exclude = ["legacy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
